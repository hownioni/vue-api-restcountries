<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      padding: 30px;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .window {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      width: 860px;
      overflow: hidden;
    }
    .titlebar {
      background: #0d1117;
      border-bottom: 1px solid #30363d;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dots { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .filepath {
      color: #8b949e;
      font-size: 13px;
      font-family: 'Fira Code', monospace;
      margin-left: 8px;
    }
    .code-container {
      padding: 24px;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      line-height: 1.6;
      color: #e6edf3;
      white-space: pre-wrap;
    }
    .kw { color: #ff7b72; font-weight: 600; }
    .fn { color: #d2a8ff; font-weight: 600; }
    .str { color: #a5d6ff; }
    .comment { color: #8b949e; font-style: italic; }
    .prop { color: #79c0ff; }
    .tag { color: #7ee787; }
    .attr { color: #79c0ff; }
    .num { color: #79c0ff; }
    .punct { color: #d2a8ff; }
    .line-no { color: #484f58; user-select: none; display: inline-block; width: 32px; text-align: right; margin-right: 16px; }
  </style>
</head>
<body id="body">
  <div class="window" id="window">
    <div class="titlebar">
      <div class="dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <span class="filepath" id="filepath">src/App.vue</span>
    </div>
    <div class="code-container" id="code"></div>
  </div>
</body>
</html>
